[package]
name = "vrc-mpris-osc"
version = "0.1.0"
edition = "2021"
description = "Lightweight daemon that bridges Linux MPRIS media players to the VRChat OSC Chatbox"
license = "MIT"
authors = ["vrc-mpris-osc contributors"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
zbus = { version = "3.14", default-features = false, features = ["tokio"] }
futures-util = "0.3"
rosc = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
once_cell = "1"
clap = { version = "=4.4.18", features = ["derive"] }
dirs = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned transitive dependencies to stay compatible with the distro-packaged
# Rust 1.75 toolchain (newer releases of these crates require edition2024).
indexmap = "=2.2.6"
zerocopy = "=0.7.35"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "vrc-mpris-osc"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
